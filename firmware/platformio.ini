[env:esp32s3]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 115200
upload_flags =
  --no-stub
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -fexceptions
build_src_filter =
  +<*>
  -<c3/*>
board_build.embed_files =
  src/qris_bg.png
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.3.0
  adafruit/Adafruit NeoPixel@^1.12.3

[env:esp32s3-kata]
extends = env:esp32s3
custom_voice = bank-kata-id
extra_scripts = pre:select_voice.py
build_flags =
  ${env:esp32s3.build_flags}
  -DWORD_BANK=1
board_build.embed_files =
  src/qris_bg.png
  .voice/koin-krincing.wav
  .voice/diterima.wav
  .voice/satu.wav
  .voice/dua.wav
  .voice/tiga.wav
  .voice/empat.wav
  .voice/lima.wav
  .voice/enam.wav
  .voice/tujuh.wav
  .voice/delapan.wav
  .voice/sembilan.wav
  .voice/sepuluh.wav
  .voice/sebelas.wav
  .voice/belas.wav
  .voice/puluh.wav
  .voice/ratus.wav
  .voice/ribu.wav
  .voice/juta.wav
  .voice/miliar.wav
  .voice/seratus.wav
  .voice/seribu.wav
  .voice/sejuta.wav
  .voice/rupiah.wav

[env:esp32s3-kata-bank]
extends = env:esp32s3-kata
custom_voice = bank-kata-id

[env:esp32c3]
platform = espressif32@6.11.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions-c3.csv
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -DWORD_BANK=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -fexceptions
build_src_filter =
  +<bank.cpp>
  +<net.cpp>
  +<c3/*.cpp>
custom_voice = bank-kata-id
extra_scripts = pre:select_voice.py
board_build.embed_files =
  .voice/koin-krincing.wav
  .voice/diterima.wav
  .voice/satu.wav
  .voice/dua.wav
  .voice/tiga.wav
  .voice/empat.wav
  .voice/lima.wav
  .voice/enam.wav
  .voice/tujuh.wav
  .voice/delapan.wav
  .voice/sembilan.wav
  .voice/sepuluh.wav
  .voice/sebelas.wav
  .voice/belas.wav
  .voice/puluh.wav
  .voice/ratus.wav
  .voice/ribu.wav
  .voice/juta.wav
  .voice/miliar.wav
  .voice/seratus.wav
  .voice/seribu.wav
  .voice/sejuta.wav
  .voice/rupiah.wav
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11
  bblanchon/ArduinoJson@^7.3.0

[env:esp32c3-bank]
extends = env:esp32c3
custom_voice = bank-kata-id
